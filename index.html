<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777GACORBETDAH - OFFICIAL SIMULATOR</title>
    <style>
        :root {
            --gold: #ffd700;
            --neon: #00f3ff;
            --dark: #0d0d0d;
            --vip: #ff0055;
            --green: #00ff44;
        }

        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 400px;
            background: #1a1a1a;
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
            position: relative;
        }

        /* Stats & Header */
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { color: var(--gold); margin: 0; font-size: 22px; text-transform: uppercase; }
        .vip-badge { color: var(--vip); font-weight: bold; font-size: 12px; display: block; height: 15px; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #252525;
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid var(--neon);
            text-align: center;
        }

        .stat-card span { color: var(--neon); font-weight: bold; display: block; font-size: 16px; }

        /* Layar Control */
        .screen { display: none; }
        .active { display: block; }

        /* Slot Machine */
        .slot-display {
            background: black;
            height: 100px;
            border: 3px double var(--gold);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            margin: 15px 0;
            transition: 0.1s;
        }

        .is-spinning { animation: shake 0.1s infinite; filter: blur(2px); }
        @keyframes shake { 0% {transform: translate(1px,1px)} 50% {transform: translate(-1px,-2px)} 100% {transform: translate(1px,-1px)} }

        /* Input & Button Styles */
        input, select {
            width: 100%; padding: 12px; margin: 8px 0; background: #333; border: 1px solid #555;
            color: white; border-radius: 8px; box-sizing: border-box;
        }
        input:focus { border-color: var(--gold); outline: none; }

        .btn {
            width: 100%; padding: 14px; margin: 5px 0; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        .btn-main { background: linear-gradient(45deg, #ff8c00, #ffd700); color: black; }
        .btn-dark { background: #333; color: white; }
        .btn-vip { background: var(--vip); color: white; }
        .btn-green { background: var(--green); color: black; }

        hr { border: 0; border-top: 1px solid #444; margin: 15px 0; }
        
        #wdDetail {
            background: #000; padding: 10px; border: 1px dashed var(--green);
            font-size: 11px; margin-top: 10px; display: none; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginScreen" class="screen active">
        <div class="header"><h1>PLAYER LOGIN</h1></div>
        <input type="email" id="email" placeholder="Email Akun">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn btn-main" onclick="doLogin()">MASUK SEKARANG</button>
    </div>

    <div id="mainScreen" class="screen">
        <div class="header">
            <span id="vipTag" class="vip-badge"></span>
            <h1>777GACORBETDAH</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">KOIN<span id="koinVal">0</span></div>
            <div class="stat-card">TUNAI<span id="tunaiVal">Rp0</span></div>
        </div>

        <div class="slot-display" id="slotMachine">7 7 7</div>

        <label style="font-size: 12px; color: #888;">BET (MIN 400 - MAX 100K):</label>
        <input type="number" id="betInput" value="400" min="400" max="100000">

        <button class="btn btn-main" onclick="handleSpin()">SPIN 7777</button>
        <button class="btn btn-dark" id="autoBtn" onclick="toggleAuto()">AUTO SPIN: OFF</button>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn btn-dark" onclick="show('exchangeScreen')">🔄 TUKAR KOIN</button>
            <button class="btn btn-dark" onclick="show('redeemScreen')">🎁 REDEM</button>
        </div>

        <button class="btn btn-green" onclick="show('wdScreen')">PENARIKAN (WD)</button>
        <button class="btn btn-vip" onclick="show('vipScreen')">AKSES VIP</button>
    </div>

    <div id="exchangeScreen" class="screen">
        <h3>TUKAR KOIN KE TUNAI</h3>
        <p style="font-size: 12px; color: #aaa;">Rate: 951 Koin = Rp5</p>
        <input type="number" id="exAmount" placeholder="Jumlah koin ditukar" oninput="calcEx()">
        <p id="exPreview" style="font-size: 12px; color: var(--neon);">Estimasi: Rp0</p>
        <button class="btn btn-main" onclick="confirmExchange()">KONFIRMASI TUKAR</button>
        <button class="btn btn-dark" onclick="show('mainScreen')">KEMBALI</button>
    </div>

    <div id="wdScreen" class="screen">
        <h3>PENARIKAN DANA</h3>
        <select id="wdWallet">
            <option value="DANA">DANA</option>
            <option value="GOPAY">GOPAY</option>
            <option value="OVO">OVO</option>
        </select>
        <input type="text" id="wdNo" placeholder="Nomor Wallet/Rekening">
        <input type="text" id="wdName" placeholder="Nama Pemilik">
        <input type="number" id="wdAmt" placeholder="Nominal (Min Rp1.000.000)">
        <button class="btn btn-green" onclick="processWD()">KONFIRMASI WD</button>
        <div id="wdDetail"></div>
        <button class="btn btn-dark" onclick="show('mainScreen')">KEMBALI</button>
    </div>

    <div id="redeemScreen" class="screen">
        <h3>REDEEM CODE</h3>
        <input type="text" id="redIn" placeholder="Masukkan Kode">
        <button class="btn btn-main" onclick="doRedeem()">KLAIM KOIN</button>
        <button class="btn btn-dark" onclick="show('mainScreen')">KEMBALI</button>
    </div>

    <div id="vipScreen" class="screen">
        <h3>AKTIVASI VIP</h3>
        <select><option>Google</option><option>Facebook</option></select>
        <input type="text" placeholder="No Wallet Verifikasi">
        <input type="text" id="vipCode" placeholder="No Index Admin">
        <button class="btn btn-vip" onclick="doVip()">MASUK SEKARANG</button>
        <button class="btn btn-dark" onclick="show('mainScreen')">KEMBALI</button>
    </div>
</div>

<script>
    // --- DATABASE & AUTO SAVE ---
    let db = JSON.parse(localStorage.getItem('gacor_db_v2')) || {
        koin: 0,
        tunai: 0,
        isVIP: false,
        claimed: [],
        lastDaily: ''
    };

    function save() {
        localStorage.setItem('gacor_db_v2', JSON.stringify(db));
        render();
    }

    function render() {
        document.getElementById('koinVal').innerText = db.koin.toLocaleString();
        document.getElementById('tunaiVal').innerText = 'Rp' + db.tunai.toLocaleString();
        document.getElementById('vipTag').innerText = db.isVIP ? "✪ VIP MEMBER ✪" : "";
    }

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // --- LOGIKA LOGIN & VIP ---
    function doLogin() {
        if(document.getElementById('email').value && document.getElementById('pass').value) {
            show('mainScreen');
            if(db.isVIP) checkDaily();
            render();
        } else { alert("Lengkapi login bray!"); }
    }

    function doVip() {
        if(document.getElementById('vipCode').value === "S619_9DJOK-KODE_VERIV") {
            db.isVIP = true;
            db.tunai += 10000;
            alert("VIP AKTIF! Bonus Rp10.000 masuk Tunai.");
            show('mainScreen');
            save();
        } else { alert("Kode Index Salah!"); }
    }

    function checkDaily() {
        let now = new Date().toDateString();
        if(db.lastDaily !== now) {
            db.koin += 2000;
            db.lastDaily = now;
            alert("Login VIP: +2.000 Koin Harian!");
            save();
        }
    }

    // --- GAME SLOT ---
    let spinning = false;
    let autoInt = null;

    function handleSpin() {
        if(spinning) return;
        let bet = parseInt(document.getElementById('betInput').value);
        if(db.koin < bet) { stopAuto(); return alert("Koin Kurang!"); }
        if(bet < 400 || bet > 100000) return alert("Bet 400 - 100rb!");

        spinning = true;
        db.koin -= bet;
        save();

        const slot = document.getElementById('slotMachine');
        slot.classList.add('is-spinning');

        setTimeout(() => {
            slot.classList.remove('is-spinning');
            const items = ['7', '💎', '🍒', '🔔', '⭐', '🍋'];
            let r = [items[Math.floor(Math.random()*6)], items[Math.floor(Math.random()*6)], items[Math.floor(Math.random()*6)]];
            slot.innerText = r.join(" ");

            if(r[0] === r[1] && r[1] === r[2]) {
                let m = (r[0] === '7') ? 50 : 10;
                let w = bet * m;
                db.koin += w;
                alert("GACOR! Menang " + w + " Koin!");
            }
            spinning = false;
            save();
        }, 800);
    }

    function toggleAuto() {
        if(!db.isVIP) return alert("Khusus VIP Member!");
        if(autoInt) { stopAuto(); }
        else {
            autoInt = setInterval(handleSpin, 1600);
            document.getElementById('autoBtn').innerText = "AUTO SPIN: ON";
            document.getElementById('autoBtn').style.color = "var(--gold)";
        }
    }
    function stopAuto() {
        clearInterval(autoInt); autoInt = null;
        document.getElementById('autoBtn').innerText = "AUTO SPIN: OFF";
        document.getElementById('autoBtn').style.color = "white";
    }

    // --- EXCHANGE (KOIN KE TUNAI) ---
    function calcEx() {
        let val = parseInt(document.getElementById('exAmount').value) || 0;
        let res = Math.floor((val / 951) * 5);
        document.getElementById('exPreview').innerText = "Estimasi: Rp" + res.toLocaleString();
    }

    function confirmExchange() {
        let amt = parseInt(document.getElementById('exAmount').value);
        if(!amt || amt < 951) return alert("Minimal tukar 951 koin!");
        if(db.koin < amt) return alert("Koin tidak cukup!");

        let hasil = Math.floor((amt / 951) * 5);
        db.koin -= amt;
        db.tunai += hasil;
        alert(`Sukses! ${amt} Koin ditukar jadi Rp${hasil}`);
        document.getElementById('exAmount').value = "";
        save();
        show('mainScreen');
    }

    // --- WITHDRAW (TUNAI KE REKENING) ---
    function processWD() {
        let amt = parseInt(document.getElementById('wdAmt').value);
        if(!amt || amt < 1000000) return alert("Minimal WD Rp1.000.000");
        if(db.tunai < amt) return alert("Saldo Tunai tidak cukup! Tukar koin dulu bray.");

        db.tunai -= amt;
        let det = document.getElementById('wdDetail');
        det.style.display = "block";
        det.innerHTML = `
            <b>PENARIKAN DIPROSES</b><br>
            ID: #GCR${Math.floor(Math.random()*99999)}<br>
            Tujuan: ${document.getElementById('wdWallet').value} - ${document.getElementById('wdNo').value}<br>
            Nama: ${document.getElementById('wdName').value}<br>
            Nominal: Rp${amt.toLocaleString()}<br>
            Status: <span style="color:yellow">PENDING (MENUNGGU ADMIN)</span>
        `;
        save();
    }

    // --- REDEEM ---
    function doRedeem() {
        let c = document.getElementById('redIn').value;
        if(db.claimed.includes(c)) return alert("Kode sudah dipakai!");
        
        let bonus = 0;
        if(/^KODEADMIN[1-9]\d{0,4}$/.test(c)) bonus = 951 * 1000;
        else {
            const list = {'777GACORBET': 15000, 'SITUSBYLDEV': 20000, 'RAPSXLDEV': 25000, 'ATTACKXLDEV': 30000};
            bonus = list[c] || 0;
        }

        if(bonus > 0) {
            db.koin += bonus;
            db.claimed.push(c);
            alert("Berhasil klaim " + bonus + " koin!");
            save();
            show('mainScreen');
        } else { alert("Kode salah bray!"); }
    }

    // Inisialisasi
    render();
</script>
</body>
</html>
